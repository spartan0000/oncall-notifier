<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Call Notifier</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 16px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 4px; margin-top: 12px; }
  input, textarea { width: 100%; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { margin-top: 16px; width: 100%; padding: 12px; font-size: 1rem; background: #1a5fb4; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #999; }
  #status { margin-top: 14px; font-size: 0.9rem; white-space: pre-wrap; }
  #oncall { font-size: 0.9rem; color: #555; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Notify on-call surgeon</h1>
  <div id="oncall">Loading current on-call...</div>

  <div class="card">
    <label for="sender">Your name</label>
    <input id="sender" type="text" placeholder="e.g. David Lee" />

    <label for="reason">Reason (no patient details)</label>
    <input id="reason" type="text" value="Non-urgent transfer inquiry" />

    <button id="sendBtn">Send notification</button>
    <div id="status"></div>
  </div>

  <script>
    async function loadOncall() {
      try {
        const res = await fetch('/oncall');
        const data = await res.json();
        document.getElementById('oncall').textContent =
          res.ok ? `Currently on call: ${data.name}` : `Error: ${data.detail}`;
      } catch (e) {
        document.getElementById('oncall').textContent = 'Could not reach server.';
      }
    }

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const sender = document.getElementById('sender').value.trim();
      const reason = document.getElementById('reason').value.trim();
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('sendBtn');

      if (!sender) {
        statusEl.textContent = 'Please enter your name.';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Sending...';

      try {
        const res = await fetch('/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender_name: sender, reason: reason }),
        });
        const data = await res.json();
        statusEl.textContent = res.ok
          ? `Sent to ${data.surgeon_name} (status: ${data.status}).`
          : `Error: ${data.detail}`;
      } catch (e) {
        statusEl.textContent = 'Request failed: ' + e;
      } finally {
        btn.disabled = false;
      }
    });

    loadOncall();
  </script>
</body>
</html>
